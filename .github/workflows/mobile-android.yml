# Builds the RefineryLens Android app for Google Play. Run it from the Actions tab ("Run workflow").
# Without signing secrets it still produces a debug APK you can install on a phone to try the app.
# Secrets (Settings > Secrets and variables > Actions), see mobile/README.md:
#   CAP_SERVER_URL               production https address of RefineryLens (also accepted as a variable)
#   GOOGLE_SERVICES_JSON_BASE64  base64 of android/app/google-services.json from Firebase (push notifications)
#   ANDROID_KEYSTORE_BASE64      base64 of the upload keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Mobile - Android build

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown in the store, e.g. 1.0.0"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CAP_SERVER_URL: ${{ secrets.CAP_SERVER_URL || vars.CAP_SERVER_URL }}
      RL_VERSION_NAME: ${{ inputs.version_name }}
      # Google Play needs a higher number for every upload; the run number always grows.
      RL_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm ci
      - name: Check the server address is set
        run: |
          if [ -z "$CAP_SERVER_URL" ]; then echo "Set CAP_SERVER_URL (secret or variable) to the production https address."; exit 1; fi
      - name: Sync web settings into the Android project
        run: npx cap sync android
      - name: Add Firebase config for push notifications
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json; else echo "::warning::No google-services.json; push notifications will not work in this build."; fi
      - name: Debug APK (install directly on a phone to test)
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Signed release bundle for Google Play
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then echo "::warning::No upload keystore; skipping the signed bundle."; exit 0; fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export RL_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks"
          cd android && ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: refinerylens-android-${{ inputs.version_name }}-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
