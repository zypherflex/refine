name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: refinerylens
          POSTGRES_PASSWORD: refinerylens
          POSTGRES_DB: refinerylens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U refinerylens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://refinerylens:refinerylens@localhost:5432/refinerylens
      SESSION_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Create the test database
        run: PGPASSWORD=refinerylens psql -h localhost -U refinerylens -c "CREATE DATABASE refinerylens_test"
      - run: npm run typecheck
      - run: npx eslint src tests prisma
      - name: Unit and integration tests
        run: npm test
      - name: Migrate and seed
        run: npm run db:migrate && npm run db:seed
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
