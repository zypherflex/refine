<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RefineryLens</title>
<style>
  :root { color-scheme: light; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9fd; color: #111c3a; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom); }
  .card { max-width: 22rem; background: #fff; border-radius: 20px; padding: 32px 24px; text-align: center; box-shadow: 0 12px 32px -12px rgba(11,21,48,.22); }
  img { width: 64px; height: 64px; }
  h1 { font-size: 22px; margin: 16px 0 8px; }
  p { margin: 0 0 20px; color: #45557c; font-size: 15px; }
  button { font: inherit; font-weight: 600; color: #fff; background: #087c47; border: 0; border-radius: 12px; padding: 12px 20px; min-height: 44px; }
  .band { position: fixed; inset: 0 0 auto; height: 4px; background: linear-gradient(90deg, #087c47 0 33.3%, #fff 33.3% 66.6%, #087c47 66.6%); }
</style>
</head>
<body>
<div class="band" aria-hidden="true"></div>
<main class="card">
  <img src="icon.png" alt="">
  <h1>Can't reach RefineryLens</h1>
  <p>Check your connection. Live prices, messages and jobs need the internet.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
